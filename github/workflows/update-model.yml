name: update-model

# MLB needs no API token - the Stats API is open. That is why this workflow has no secrets
# except MODEL_URL, and why it can never hit a quota the way the PandaScore ones do.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"     # 13:00 UTC = 6:30pm India, before the US evening slate

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests numpy

      - name: Restore the game cache
        uses: actions/cache@v4
        with:
          path: cache_mlb_ml
          key: mlb-cache-${{ github.run_id }}
          restore-keys: |
            mlb-cache-

      - name: Train
        run: python mlb_ml_trainer.py

      - name: Build model.js
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: python build.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add model.js model.json
          git diff --staged --quiet || git commit -m "model $(date -u +%Y-%m-%d)"
          git push

      - name: Purge the CDN
        run: curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/model.js" || true
